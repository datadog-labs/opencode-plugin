name: Publish to npm

# Fires automatically when a GitHub Release is published (the public repo's
# release.yaml creates one when a release PR merges to main). Also exposes a
# manual workflow_dispatch for bootstrap, dry-runs, and dist-tag overrides.

on:
  release:
    types:
      - 'published'
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag to publish under'
        required: false
        default: 'latest'
        type: string
      dry_run:
        description: 'Run npm publish --dry-run (no upload). Defaults to true so a casual manual trigger does not publish.'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '22.19.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    # protected-main-env restricts secrets/OIDC to the default branch and tags.
    # Must exist on the public repo before the first run; see release docs.
    environment: protected-main-env
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Verify package is in the @datadog scope
        run: |
          NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).name)")
          case "$NAME" in
            @datadog/*) echo "Publishing $NAME";;
            *) echo "Refusing to publish: package name '$NAME' is not in the @datadog scope"; exit 1;;
          esac

      - name: Setup NodeJs
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Publish
        env:
          # On release events these inputs are absent; fall back to safe defaults
          # (publish under `latest`, no dry-run). On workflow_dispatch the user's
          # choices flow through unchanged.
          NPM_TAG: ${{ inputs.tag || 'latest' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          ARGS="--provenance --access public --tag ${NPM_TAG}"
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npm publish $ARGS
